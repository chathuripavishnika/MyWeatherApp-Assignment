<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
    <div class="container">
    <h1> 🌤️ Weather App 🌧️</h1>
    <h4>--------Check the Weather anyWhere!--------</h4>
    <br>
    <br>
    <div class="Search-box">
        <input type="text" id="CityInput" placeholder="🔍 Search Place...">
        <button onclick="SearchWeather()">Search</button>
    </div>
    <br>
    <br>

     <div class="weather-card">

            <div class="main-weather">
                <div class="weather-icon" id="weatherIcon">🌤️</div>

                <div>
                    <h2 id="temperature">--°C</h2>
                    <h3 id="condition">Search a City</h3>
                    <p id="location">📍 Location</p>
                </div>
            </div>
    </div>
    
    <div class="weather-details">
        <div class="detail">
            <span>💧</span>
            <div>
                <p>Humidity</p>
                <h3 id="humidity">--%</h3>
            </div>

        </div>
    </div>
    
    <div class="detail">
                    <span>💨</span>
                    <div>
                        <p>Wind Speed</p>
                        <h3 id="wind">-- km/h</h3>
                    </div>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <div>
                        <p>Pressure</p>
                        <h3 id="pressure">-- hPa</h3>
                    </div>
                </div>

            
        </div>

        <h2 class="heading">Weather Conditions</h2>

        <div class="weather-types">
            <div class="type-card">
                <span>☀️</span>
                <p>Sunny</p>
            </div>

            <div class="type-card">
                <span>🌧️</span>
                <p>Rainy</p>
            </div>

            <div class="type-card">
                <span>☁️</span>
                <p>Cloudy</p>
            </div>

            <div class="type-card">
                <span>📍</span>
                <p>Location</p>
            </div>

            <div class="type-card">
                <span>💧</span>
                <p>Water</p>
            </div>

            <div class="type-card">
                <span>💨</span>
                <p>Wind</p>
            </div>
        </div>

        <p id="message"></p>

    </div>

   

    </center>

<script src="app.js"></script>
</body>
</html>
